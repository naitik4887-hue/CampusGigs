<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CampusGigs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">CampusGigs</a>

    <form class="search" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="Search tutoring, design, coding…" aria-label="Search services" autocomplete="off" />
    </form>

    <nav class="nav" aria-label="Main">
      <a class="btn btn-primary" href="#/new">Post a service</a>
      <a class="nav-link" href="#/inbox">Messages<span class="badge" id="unreadBadge" hidden></span></a>
      <div class="menu">
        <button type="button" class="avatar" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu"></button>
        <div class="menu-pop" id="menuPop" hidden>
          <div class="menu-user"><b id="menuName"></b><span id="menuUni"></span></div>
          <a href="#/mine">My listings</a>
          <button type="button" id="logoutBtn">Log out</button>
        </div>
      </div>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
